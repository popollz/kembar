[package]
name = "kembar"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Terminal duplicate finder with smart selection, for macOS"
license = "MIT"

[dependencies]
czkawka_core = "12.0.2"
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 4
